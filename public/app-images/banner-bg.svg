<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="800" viewBox="0 0 1440 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#1E293B" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.08"/>
    </linearGradient>

    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="b" />
      <feBlend in="SourceGraphic" in2="b" mode="normal" />
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="1440" height="800" fill="url(#g1)"/>

  <!-- Soft glowing blobs -->
  <g filter="url(#f1)">
    <ellipse cx="300" cy="180" rx="260" ry="120" fill="url(#g2)"/>
    <ellipse cx="1100" cy="120" rx="200" ry="100" fill="#0EA5E9" fill-opacity="0.08"/>
  </g>

  <!-- Decorative wave shape near bottom -->
  <path d="M0,560 C160,480 320,640 480,600 C640,560 800,440 960,480 C1120,520 1280,420 1440,460 L1440,800 L0,800 Z"
        fill="#0D1117" fill-opacity="0.9"/>

  <!-- Subtle overlay lines -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <path d="M0,120 L1440,120"/>
    <path d="M0,240 L1440,240"/>
  </g>

  <!-- Optional centered faint grid (keeps file light) -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.6">
    <!-- verticals -->
    <!-- a few to add texture -->
    <path d="M180,0 L180,800"/>
    <path d="M360,0 L360,800"/>
    <path d="M720,0 L720,800"/>
  </g>
</svg>
